<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>akkaaaz1 blastt - Portal Resmi</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <script src="https://jsdelivr.net"></script>
    <style>
        * { box-sizing: border-box; margin:0; padding:0; font-family: sans-serif; }
        body { background: #0f0a14; color: #f3f4f6; padding: 16px; display: flex; justify-content: center; min-height: 100vh; align-items: center; }
        .container { background: #150f1d; padding: 20px; border-radius: 16px; width: 100%; max-width: 440px; border: 1px solid #281930; }
        .tab-menu { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; border-radius: 8px; background: #0f0a14; color: #a49eb0; cursor: pointer; border: 1px solid #2a1f35; }
        .tab-btn.active { background: #d61c6f; color: white; border: none; }
        .info-box { background: #251021; border: 1px solid #4a1534; color: #e599c5; padding: 10px; border-radius: 8px; font-size: 12px; margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: #a49eb0; margin-bottom: 4px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #201828; background: #08050c; color: white; }
        .btn-submit { width: 100%; padding: 12px; background: #d61c6f; color: white; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
        .page { display: none; } .page.active { display: block; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .stat-card { background: #08050c; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #201828; }
    </style>
</head>
<body>
<div class="container">
    <div style="text-align:center; margin-bottom:15px;"><h2 style="color:#d61c6f;">akkaaaz1 blastt</h2><p style="color:#8c8594; font-size:12px;">Portal Reward (Rate: Rp 700/Pesan)</p></div>

    <div id="page-login" class="page active">
        <div class="tab-menu"><button class="tab-btn active">Menu Worker</button><button class="tab-btn" onclick="switchPage('page-admin-login')">Admin Panel</button></div>
        <div class="info-box">Masukkan Akun Worker kamu.</div>
        <div class="form-group"><input type="text" id="login-user" placeholder="Username"></div>
        <div class="form-group"><input type="password" id="login-pass" placeholder="Password"></div>
        <button class="btn-submit" onclick="prosesLogin()">Masuk Portal Worker</button>
        <a style="display:block; text-align:center; color:#a49eb0; font-size:12px; margin-top:10px; cursor:pointer;" onclick="switchPage('page-daftar')">bubub belum punya akun? <span style="color:#d61c6f; font-weight:bold;">daftar klik disini</span></a>
    </div>

    <div id="page-daftar" class="page">
        <div class="info-box">Daftar Akun Baru Worker</div>
        <div class="form-group"><input type="text" id="reg-user" placeholder="Username baru"></div>
        <div class="form-group"><input type="password" id="reg-pass" placeholder="Password baru"></div>
        <button class="btn-submit" onclick="prosesDaftar()">Daftar Akun Sekarang</button>
        <a style="display:block; text-align:center; color:#a49eb0; font-size:12px; margin-top:10px; cursor:pointer;" onclick="switchPage('page-login')">Sudah punya akun? <span style="color:#d61c6f;">Login</span></a>
    </div>

    <div id="page-dashboard-worker" class="page">
        <div class="info-box" style="background:#112518; color:#99e5b5;">Halo, <b id="nama-worker">Worker</b>! Status WA: <span id="status-wa" class="badge danger">Terputus</span></div>
        <div class="stats-grid">
            <div class="stat-card"><p style="font-size:11px; color:#8c8594;">Total Kirim</p><h3>140</h3></div>
            <div class="stat-card"><p style="font-size:11px; color:#8c8594;">Pendapatan</p><h3 style="color:#f472b6;">Rp 98.000</h3></div>
        </div>
        <div id="section-link-wa">
            <div class="form-group"><input type="number" id="wa-number" placeholder="628xxxxxxxx"></div>
            <button class="btn-submit" style="background:#22c55e;" onclick="tautkanWA()">Hubungkan WA</button>
        </div>
        <div id="section-blast" style="display:none; margin-top:10px;">
            <div class="form-group"><select id="blast-interval"><option value="2">2 Detik</option><option value="5">5 Detik</option><option value="30">30 Detik</option></select></div>
            <button class="btn-submit" id="btn-mulai-blast" onclick="mulaiKerjaBlast()">Mulai Kirim Massal</button>
        </div>
        <div style="border-top:1px dashed #4a1d35; padding-top:10px; margin-top:15px;">
            <h4 style="color:#f472b6; font-size:13px; margin-bottom:5px;">Menu WD (Min. 20k)</h4>
            <div class="form-group"><input type="number" id="wd-jumlah" placeholder="Jumlah WD"></div>
            <button class="btn-submit" style="background:#a855f7;" onclick="alert('WD Berhasil diajukan!')">Ajukan WD</button>
        </div>
        <button class="btn-submit" style="background:#2d3446; margin-top:15px;" onclick="logout()">Keluar Akun</button>
    </div>

    <div id="page-admin-login" class="page">
        <div class="tab-menu"><button class="tab-btn" onclick="switchPage('page-login')">Menu Worker</button><button class="tab-btn active">Admin Panel</button></div>
        <div class="form-group"><input type="text" id="admin-user" placeholder="Username admin"></div>
        <div class="form-group"><input type="password" id="admin-pass" placeholder="Password admin"></div>
        <button class="btn-submit" onclick="loginAdmin()">Masuk Sebagai Admin</button>
    </div>

    <div id="page-dashboard-admin" class="page">
        <h3 style="color:#f472b6; margin-bottom:10px;">Panel Admin</h3>
        <div class="form-group"><textarea id="admin-pesan-konten" rows="2">Halo! Pesan massal resmi via Fonnte.</textarea></div>
        <div class="form-group"><textarea id="admin-list-nomor" rows="2">628123456789,628987654321</textarea></div>
        <button class="btn-submit" style="background:#2563eb;" onclick="alert('Tugas disimpan!')">Simpan Tugas</button>
        <button class="btn-submit" style="background:#2d3446; margin-top:15px;" onclick="switchPage('page-login')">Keluar Admin</button>
    </div>
</div>

<script>
    const url = "https://supabase.co";
    const key = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNwamFrcHdneXR1d2puaGNnYmNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDMxMzI4OTgsImV4cCI6MjA1ODcxMjg5OH0.eD9F-7tq4X83Fp9uG8_cGFN6bE"; 
    const tok = "w6CGL9b9EEE9EXzpMN4sZFMoi";
    const supabaseClient = supabase.createClient(url, key);
    let currentUser = "";

    function switchPage(pId) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById(pId).classList.add('active'); }
    async function prosesDaftar() {
        let u = document.getElementById('reg-user').value.trim();
        let p = document.getElementById('reg-pass').value.trim();
        await supabaseClient.from('users_portal').insert([{ username: u, password: p, pesan_kirim: 0, total_dana: 0 }]);
        alert("Sukses Daftar!"); switchPage('page-login');
    }
    function prosesLogin() { currentUser = document.getElementById('login-user').value; document.getElementById('nama-worker').innerText = currentUser; switchPage('page-dashboard-worker'); }
    function logout() { currentUser = ""; switchPage('page-login'); }
    function tautkanWA() { document.getElementById('section-link-wa').style.display = "none"; document.getElementById('section-blast').style.display = "block"; alert("WA Terhubung!"); }
    function mulaiKerjaBlast() {
        let list = document.getElementById('admin-list-nomor').value.split(',');
        let msg = document.getElementById('admin-pesan-konten').value;
        list.forEach(t => { fetch('https://fonnte.com', { method: 'POST', headers: { 'Authorization': tok }, body: new URLSearchParams({ 'target': t.trim(), 'message': msg }) }); });
        alert("Blast Selesai Terkirim!");
    }
    function loginAdmin() {
        if(document.getElementById('admin-user').value === "atminaka" && document.getElementById('admin-pass').value === "azka123") { switchPage('page-dashboard-admin'); } else { alert("Salah!"); }
    }
</script>
</body>
</html>
